<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EDITOR - ESPAÇO INFINITO SENHAS CONSERTADAS</title>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

const firebaseConfig = { apiKey: "AIzaSyCLaqaOCJnkfG4LID1Y5RoFpgEsX9nYGOM", authDomain: "testeapi-1ad07.firebaseapp.com", projectId: "testeapi-1ad07", storageBucket: "testeapi-1ad07.firebasestorage.app", messagingSenderId: "323295128076", appId: "1:323295128076:web:3af167424f75b680f19c29" };
const app = initializeApp(firebaseConfig);
window.db = getFirestore(app);
window.fb = { doc, setDoc, getDoc, getDocs, collection, deleteDoc, query, where };
</script>
<style>
:root{--bg:#0f172a;--card:#1e293b;--input:#1e293b;--text:#e2e8f0;--border:#334155;--azul:#3b82f6}
body.claro{--bg:#dbeafe;--card:#ffffff;--input:#eff6ff;--text:#1e3a8a;--border:#93c5fd;--azul:#2563eb}
body{font-family:system-ui;background:var(--bg);color:var(--text);text-align:center;padding:10px;margin:0}
.card{background:var(--card);padding:22px;border-radius:20px;max-width:980px;margin:20px auto;text-align:left;border:2px solid var(--border)}
.input-padrao{width:100%;padding:12px 16px;margin:6px 0;border-radius:12px;border:2px solid var(--border);font-size:13px;box-sizing:border-box;background:var(--input);color:var(--text)}
.btn-tema{position:fixed;top:12px;right:12px;z-index:999;background:linear-gradient(135deg,#2563eb,#60a5fa);color:#fff;padding:11px 20px;border-radius:30px;font-weight:900;font-size:12px;border:none;cursor:pointer}
input,textarea,select{width:100%;padding:12px;margin:6px 0;border-radius:12px;border:2px solid var(--border);font-size:15px;box-sizing:border-box;background:var(--input);color:var(--text)}
button{border:none;padding:11px 16px;font-weight:800;border-radius:30px;margin:3px;cursor:pointer;font-size:10px}
.btn-go{background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff}.btn-blue{background:linear-gradient(135deg,#2563eb,#3b82f6);color:#fff}.btn-red{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff}.btn-sec{background:var(--border);color:var(--text)}.btn-edit-prova{background:linear-gradient(135deg,#facc15,#eab308);color:#000}.btn-img{background:linear-gradient(135deg,#a855f7,#9333ea);color:#fff}.btn-logo{background:linear-gradient(135deg,#2563eb,#60a5fa);color:#fff;width:100%;margin-top:8px;font-size:10px}.btn-save{background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;width:100%;padding:14px;margin-top:10px;font-size:13px}.btn-edit{background:linear-gradient(135deg,#facc15,#eab308);color:#000;width:100%;padding:14px;margin-top:10px}
.q-editor{background:var(--input);padding:18px;border-radius:16px;margin:28px 0;border:2px solid var(--border);position:relative}.q-editor.salva{border-color:#22c55e}.q-editor.pendente{border-color:#f87171}
.q-header{position:absolute;top:-14px;left:12px;display:flex;gap:8px}.badge-questao{background:linear-gradient(135deg,#2563eb,#3b82f6);color:#fff;padding:5px 14px;border-radius:20px;font-weight:900;font-size:12px}.badge-pendente{background:#ef4444;color:#fff;padding:4px 10px;border-radius:20px;font-size:11px}.badge-salva{background:#22c55e;color:#fff;padding:4px 10px;border-radius:20px;font-size:11px}
.tipo-questao{display:flex;gap:8px;margin:12px 0}.btn-tipo{flex:1;padding:12px;border-radius:30px;font-weight:900;border:2px solid var(--border);background:var(--card);color:var(--text)}.btn-tipo.ativo.multipla{background:var(--azul);color:#fff}.btn-tipo.ativo.dissertativa{background:#facc15;color:#000}
.config-header{background:linear-gradient(135deg,var(--card),var(--input));padding:18px;border-radius:18px;border:2px solid var(--azul);margin-bottom:18px;display:grid;grid-template-columns:110px 1fr;gap:14px}
.logo-preview{width:100px;height:100px;object-fit:contain;background:#fff;border-radius:14px;border:3px solid var(--border);display:block}.area-img{border:2px dashed #a855f7;padding:10px;border-radius:14px;margin:8px 0;text-align:center;background:var(--card)}.aviso-editando{display:none;background:linear-gradient(135deg,#facc15,#eab308);color:#000;padding:10px;border-radius:10px;text-align:center;font-weight:900;font-size:12px;margin-bottom:12px}
h2{color:var(--azul)} #telaLogin{position:fixed;inset:0;background:radial-gradient(circle at top,#dbeafe,#1e3a8a);display:flex;align-items:center;justify-content:center;z-index:10000;padding:20px}.login-card{background:#fff;padding:30px;border-radius:20px;max-width:380px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,0.3);text-align:center;color:#1e3a8a}
.top-bar{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:2px solid var(--border);padding:10px 14px;border-radius:14px;margin-bottom:14px;flex-wrap:wrap;gap:8px}.user-info{font-size:12px;font-weight:800;color:var(--azul)}.modal-fundo{position:fixed;inset:0;background:rgba(0,0,0,0.7);display:none;align-items:center;justify-content:center;z-index:9999;padding:15px}.modal-box{background:var(--card);padding:22px;border-radius:18px;max-width:750px;width:100%;border:2px solid var(--border);max-height:90vh;overflow:auto;color:var(--text)}.lista-prof{max-height:300px;overflow:auto;margin-top:10px}.item-prof{display:flex;justify-content:space-between;align-items:center;background:var(--input);padding:10px;border-radius:10px;margin:6px 0;border:1px solid var(--border)}.aluno-card{background:linear-gradient(135deg,var(--card),var(--input));border:2px solid var(--azul);padding:18px;border-radius:16px;margin-bottom:16px}.resposta-item{background:var(--input);border:1.5px solid var(--border);padding:12px;border-radius:12px;margin:10px 0}
.opcao-aluno{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1.5px solid #cbd5e1;border-radius:10px;margin:8px 0;background:#fff;cursor:pointer}.opcao-aluno input[type="radio"]{width:22px;height:22px;flex-shrink:0;accent-color:#2563eb}.opcao-aluno label{flex:1;cursor:pointer;color:#000;font-size:13px}.opcao-aluno.selecionada{border-color:#2563eb;background:#dbeafe}
.config-prova{background:var(--input);border:2px solid #f59e0b;border-radius:14px;padding:14px;margin:10px 0}
</style></head><body>
<div id="telaLogin"><div class="login-card"><h1>📝 EDITOR INFINITO</h1><p>Senhas Consertadas</p><input id="loginUser" class="input-padrao" placeholder="USUÁRIO (ex: anna, gardoni)"><input id="loginPass" type="password" class="input-padrao" placeholder="SENHA"><button class="btn-blue" style="width:100%;padding:14px;margin-top:10px" onclick="fazerLogin()">ENTRAR</button><div style="font-size:11px;background:#eff6ff;padding:8px;border-radius:10px;text-align:left;margin-top:10px">Master: master / 1234<br>Aluno: aluno / aluno<br><b>Prof: não diferencia maiúscula</b></div><div id="loginErro" style="color:#ef4444;font-size:12px;display:none;margin-top:8px"></div><div id="statusFirebase" style="font-size:10px;color:#888;margin-top:6px">Procurando professores no Firebase...</div><button class="btn-sec" style="margin-top:10px;font-size:10px" onclick="mostrarSenhas()">🔍 VER SENHAS NO FIREBASE</button></div></div>
<button class="btn-tema" onclick="document.body.classList.toggle('claro')">☀️</button><h2>📝 EDITOR INFINITO<br><span style="font-size:12px">Fotos viram LINK - não pesam</span></h2>
<div class="card" id="appPrincipal" style="display:none"><div class="top-bar"><div class="user-info" id="infoUsuario"></div><div><button class="btn-sec" onclick="abrirGerenciarProf()" id="btnGerenciar" style="display:none">⚙️ PROFESSORES</button><button class="btn-red" onclick="sair()">🚪 SAIR</button></div></div><div id="avisoEditando" class="aviso-editando">✏️ EDITANDO NA NUVEM</div><div id="boxCabecalho" class="config-header"><div style="text-align:center"><img id="img_logo" class="logo-preview" src="https://via.placeholder.com/100"><input type="file" id="inputLogo" accept="image/*" style="display:none" onchange="trocarLogoExterno(this)"><button class="btn-logo" onclick="document.getElementById('inputLogo').click()">📁 LOGO LINK INFINITO</button></div><div><input id="nomeEscola" class="input-padrao" value="E.E. PROFESSOR ALISSON PEREIRA GUIMARÃES"><input id="tituloAvaliacao" class="input-padrao" value="ATIVIDADE DE MATEMÁTICA"><input id="nomeProfessor" class="input-padrao" placeholder="NOME DO PROFESSOR"><div style="display:grid;grid-template-columns:2fr 1fr;gap:8px"><input id="prov-titulo" class="input-padrao" placeholder="Assunto"><input id="prov-codigo" class="input-padrao" placeholder="CÓDIGO"></div></div></div><div class="config-prova"><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div><label style="font-size:11px">INÍCIO</label><input id="prov-inicio" type="datetime-local" class="input-padrao"></div><div><label style="font-size:11px">FIM</label><input id="prov-fim" type="datetime-local" class="input-padrao"></div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px"><div><label style="font-size:11px">TENTATIVAS</label><select id="prov-tentativas" class="input-padrao"><option value="0">0 - Infinito</option><option value="1">1 vez</option><option value="2">2 vezes</option><option value="3">3 vezes</option></select></div><div><label style="font-size:11px">SAIR DA TELA</label><select id="prov-saida" class="input-padrao"><option value="aviso">1 - Só aviso</option><option value="enviar_fechar">2 - Envia e fecha</option></select></div></div></div><div id="editorQuestoes"></div><button class="btn-blue" style="width:100%;padding:14px" onclick="addQuestao()">+ ADICIONAR QUESTÃO</button><button class="btn-red" style="width:100%;padding:10px;margin-top:8px" onclick="limparTodasImagens()">🧹 LIMPAR TODAS AS FOTOS</button><div style="margin-top:14px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap"><button class="btn-sec" onclick="novaProva()">+ NOVA</button><button class="btn-go" id="btnFinalizar" onclick="finalizarSalvarPC()">💾 SALVAR NA NUVEM (links)</button></div><div id="listaProvas" style="margin-top:18px"></div></div>
<div class="card" id="appAluno" style="display:none"><div class="top-bar"><div class="user-info" id="infoAluno"></div><button class="btn-red" onclick="sair()">🚪 SAIR</button></div><div class="aluno-card"><input id="alunoNome" class="input-padrao" placeholder="Nome completo"><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><input id="alunoSala" class="input-padrao" placeholder="Sala"><input id="alunoAno" class="input-padrao" placeholder="Ano"></div><button class="btn-go" style="width:100%;margin-top:8px" onclick="salvarCadastroAluno()">💾 SALVAR CADASTRO</button></div><div class="aluno-card"><div style="display:flex;gap:8px"><input id="codigoAtividadeAluno" class="input-padrao" placeholder="Código" style="flex:1"><button class="btn-blue" onclick="buscarAtividadeAluno()">🔍 BUSCAR</button></div><div id="alunoMsg" style="font-size:12px;margin-top:8px"></div><div id="alunoTentativasInfo" style="font-size:11px;margin-top:6px"></div></div><div id="areaAtividadeAluno"></div></div>
<div id="modalProf" class="modal-fundo"><div class="modal-box"><h3>⚙️ PROFESSORES</h3><input id="novoProfNome" class="input-padrao" placeholder="Nome"><input id="novoProfUser" class="input-padrao" placeholder="Usuário (minúsculo)"><input id="novoProfPass" class="input-padrao" placeholder="Senha"><button class="btn-go" style="width:100%" onclick="criarProfessor()">➕ CRIAR</button><div id="listaProfessores" class="lista-prof"></div><button class="btn-sec" style="width:100%;margin-top:10px" onclick="document.getElementById('modalProf').style.display='none'">FECHAR</button></div></div>
<div id="modalRespostas" class="modal-fundo"><div class="modal-box" style="max-width:800px"><h3 id="tituloRespostas">📊 RESPOSTAS</h3><div id="listaRespostas"></div><button class="btn-sec" style="width:100%;margin-top:12px" onclick="document.getElementById('modalRespostas').style.display='none'">FECHAR</button></div></div>
<script>
let usuarios=JSON.parse(localStorage.getItem('editor_usuarios')||'[]');if(!usuarios.length){usuarios=[{id:'master_1',nome:'Master',usuario:'master',senha:'1234',tipo:'master'},{id:'aluno_1',nome:'Aluno',usuario:'aluno',senha:'aluno',tipo:'aluno'}];localStorage.setItem('editor_usuarios',JSON.stringify(usuarios));}
let sessao=JSON.parse(localStorage.getItem('editor_sessao')||'null');
async function mostrarSenhas(){try{let snap=await fb.getDocs(fb.collection(db,'professores'));let txt='PROFESSORES NO FIREBASE:\n';snap.forEach(d=>{let p=d.data();txt+=`Usuário: ${p.usuario} | Senha: ${p.senha} | Nome: ${p.nome}\n`;});if(txt=='PROFESSORES NO FIREBASE:\n')txt+='NENHUM! Entre com master/1234 e crie.';alert(txt);}catch(e){alert('Erro: '+e.message);}}
async function verificarSessao(){sessao=JSON.parse(localStorage.getItem('editor_sessao')||'null');if(!sessao){document.getElementById('telaLogin').style.display='flex';document.getElementById('appPrincipal').style.display='none';document.getElementById('appAluno').style.display='none';return;}document.getElementById('telaLogin').style.display='none';if(sessao.tipo=='aluno'){document.getElementById('appPrincipal').style.display='none';document.getElementById('appAluno').style.display='block';document.getElementById('infoAluno').innerHTML=`🎓 ${sessao.nome}`;}else{document.getElementById('appPrincipal').style.display='block';document.getElementById('appAluno').style.display='none';document.getElementById('infoUsuario').innerHTML=`👤 ${sessao.nome} | ${sessao.tipo}`;if(sessao.tipo=='master')document.getElementById('btnGerenciar').style.display='inline-block';document.getElementById('nomeProfessor').value=sessao.nome;await carregarTudoFirebase();}}
async function fazerLogin(){
  let u=document.getElementById('loginUser').value.trim();
  let s=document.getElementById('loginPass').value.trim();
  let erroEl=document.getElementById('loginErro');
  let statusEl=document.getElementById('statusFirebase');
  if(!u||!s){erroEl.style.display='block';erroEl.innerText='❌ Digite usuário e senha';return;}
  let usuariosLocal=JSON.parse(localStorage.getItem('editor_usuarios')||'[]');
  let local=usuariosLocal.find(x=>x.usuario.toLowerCase()===u.toLowerCase()&&x.senha===s);
  if(local){localStorage.setItem('editor_sessao',JSON.stringify(local));verificarSessao();return;}
  if(u.toLowerCase()==='master'&&s==='1234'){let m={id:'master_1',nome:'Master',usuario:'master',senha:'1234',tipo:'master'};localStorage.setItem('editor_sessao',JSON.stringify(m));verificarSessao();return;}
  if(u.toLowerCase()==='aluno'&&s==='aluno'){let a={id:'aluno_1',nome:'Aluno',usuario:'aluno',senha:'aluno',tipo:'aluno'};localStorage.setItem('editor_sessao',JSON.stringify(a));verificarSessao();return;}
  try{
    statusEl.innerText='Verificando Firebase...';
    let snap=await fb.getDocs(fb.collection(db,'professores'));
    let achou=null;
    snap.forEach(d=>{let p=d.data();if(p.usuario&&p.senha){if(p.usuario.toLowerCase().trim()===u.toLowerCase().trim()&&p.senha.trim()===s.trim()){achou=p;}}});
    if(achou){let sessaoProf={id:achou.id,nome:achou.nome,usuario:achou.usuario,senha:achou.senha,tipo:'professor'};localStorage.setItem('editor_sessao',JSON.stringify(sessaoProf));verificarSessao();return;}
    erroEl.style.display='block';erroEl.innerHTML=`❌ Senha errada para "${u}".<br>Existem: ${Array.from(snap.docs).map(d=>d.data().usuario).join(', ')||'nenhum'}<br>Clique em 🔍 VER SENHAS`;statusEl.innerText=`❌ Não achei ${u}`;
  }catch(e){erroEl.style.display='block';erroEl.innerText='❌ Erro Firebase: '+e.message;}
}
function sair(){localStorage.removeItem('editor_sessao');location.reload();}
function abrirGerenciarProf(){document.getElementById('modalProf').style.display='flex';carregarListaProfFirebase();}
async function carregarListaProfFirebase(){let snap=await fb.getDocs(fb.collection(db,'professores'));let h='';snap.forEach(d=>h+=`<div class="item-prof"><div><b>${d.data().usuario}</b> - ${d.data().nome} - senha: ${d.data().senha}</div><button class="btn-red" onclick="excluirProfFirebase('${d.id}')">🗑️</button></div>`);document.getElementById('listaProfessores').innerHTML=h||'Nenhum';}
async function criarProfessor(){let n=document.getElementById('novoProfNome').value.trim(),u=document.getElementById('novoProfUser').value.trim().toLowerCase(),p=document.getElementById('novoProfPass').value.trim();if(!n||!u||!p)return alert('Preencha');await fb.setDoc(fb.doc(db,'professores',u),{id:u,usuario:u,senha:p,nome:n,timestamp:Date.now()});alert('✅ Criado: '+u+' / '+p);carregarListaProfFirebase();}
async function excluirProfFirebase(id){if(!confirm('Excluir?'))return;await fb.deleteDoc(fb.doc(db,'professores',id));carregarListaProfFirebase();}
function salvarCadastroAluno(){let n=alunoNome.value.trim(),s=alunoSala.value.trim(),a=alunoAno.value.trim();if(!n||!s||!a)return alert('Preencha');localStorage.setItem('aluno_cadastro_'+sessao.id,JSON.stringify({nome:n,sala:s,ano:a}));alert('✅ Salvo');}
let atividadeAtualAluno=null,monitorSaidaAtivo=false,provaBloqueada=false;
function desativarMonitorSaida(){monitorSaidaAtivo=false;window.onbeforeunload=null;document.removeEventListener('visibilitychange',handleVisibilityChange);}
function handleVisibilityChange(){if(!monitorSaidaAtivo||provaBloqueada)return;if(document.hidden){if(atividadeAtualAluno&&atividadeAtualAluno.acaoSaida=='enviar_fechar'){alert('⚠️ Saiu da prova! Enviando...');enviarRespostasAluno(true);}else alert('⚠️ Saiu da tela!');}}
function ativarMonitorSaida(acao){desativarMonitorSaida();monitorSaidaAtivo=true;document.addEventListener('visibilitychange',handleVisibilityChange);window.onbeforeunload=()=>{if(!provaBloqueada&&acao=='enviar_fechar')enviarRespostasAluno(true);return acao=='aviso'?'Sair?':undefined;};}
async function buscarAtividadeAluno(){
 let codigo=codigoAtividadeAluno.value.trim();if(!codigo)return alunoMsg.innerHTML='Digite código';
 let cad=JSON.parse(localStorage.getItem('aluno_cadastro_'+sessao.id)||'null');if(!cad)return alunoMsg.innerHTML='Salve cadastro';
 let p=null,docId=null;try{let q=fb.query(fb.collection(db,'provas'),fb.where('senha','==',codigo));let snap=await fb.getDocs(q);snap.forEach(d=>{p=d.data();docId=d.id;});}catch(e){}
 if(!p)return alunoMsg.innerHTML='❌ Não encontrado';
 let agora=new Date(),ini=p.inicio?new Date(p.inicio):null,fim=p.fim?new Date(p.fim):null;
 if(ini&&agora<ini)return alunoMsg.innerHTML=`⏰ Ainda não começou: ${ini.toLocaleString('pt-BR')}`;
 if(fim&&agora>fim)return alunoMsg.innerHTML=`⛔ Já terminou: ${fim.toLocaleString('pt-BR')}`;
 let resp=[];try{let q2=fb.query(fb.collection(db,'resultados'),fb.where('atividadeId','==',docId),fb.where('alunoNome','==',cad.nome));let s2=await fb.getDocs(q2);s2.forEach(d=>resp.push(d.data()));}catch(e){}
 let max=parseInt(p.maxTentativas||0);if(max>0&&resp.length>=max)return alunoMsg.innerHTML=`🚫 Limite ${max} atingido`;
 alunoMsg.innerHTML='✅ Liberada!';alunoTentativasInfo.innerHTML=`Tentativas: ${resp.length}/${max==0?'∞':max}`;
 atividadeAtualAluno={...p,_docId:docId};provaBloqueada=false;
 let logo=localStorage.getItem('logo_ee_url')||'';
 let aviso=p.acaoSaida=='enviar_fechar'?'<div style="background:#fef2f2;border:2px solid #ef4444;padding:8px;border-radius:8px;font-size:11px;text-align:center">🚨 Se sair da tela, ENVIA E FECHA!</div>':'<div style="background:#fffbeb;border:2px solid #f59e0b;padding:8px;border-radius:8px;font-size:11px;text-align:center">⚠️ Não saia da tela!</div>';
 areaAtividadeAluno.innerHTML=`<div style="background:#fff;color:#000;padding:14px;border-radius:14px;margin-top:14px"><div style="display:flex;gap:12px;border-bottom:3px solid #1e3a8a;padding-bottom:8px;margin-bottom:10px">${logo?`<img src="${logo}" style="width:56px;height:56px;object-fit:contain">`:''}<div style="flex:1;text-align:center"><b>${p.escola}</b><br>${p.tituloAva} - ${p.nome}<br><small>${p.senha}</small></div></div><div style="background:#eff6ff;padding:6px;margin-bottom:12px;font-size:12px"><b>Aluno:</b> ${cad.nome} | <b>Tentativa:</b> ${resp.length+1}/${max==0?'∞':max}</div>${aviso}${p.questoes.map((q,i)=>{return `<div style="margin-bottom:18px;padding:12px;border:2px dashed #93c5fd;border-radius:12px"><div style="font-weight:700;font-size:13px;margin-bottom:8px">${i+1}) ${q.pergunta}</div>${q.imagem?`<img src="${q.imagem}" style="width:${q.imgLarg||240}px;height:${q.imgAlt||70}px;max-width:100%;display:block;margin:6px 0;border-radius:8px">`:''}${q.tipo=='multipla'?`<div style="display:flex;flex-direction:column;gap:6px">${['A','B','C','D'].map(l=>`<div class="opcao-aluno" onclick="selecionarOpcao(this,'resp_${i}','${l}')"><input type="radio" name="resp_${i}" value="${l}" id="resp_${i}_${l}"><label for="resp_${i}_${l}"><b>${l})</b> ${q[l]}</label></div>`).join('')}</div>`:`<textarea id="resp_${i}" style="width:100%;min-height:80px;border:1.5px solid #93c5fd;border-radius:8px;padding:8px"></textarea>`}</div>`;}).join('')}<button id="btnEnviarProva" class="btn-go" style="width:100%;padding:14px" onclick="enviarRespostasAluno(false)">📤 ENVIAR PARA NUVEM</button><div id="envioOk" style="display:none;margin-top:10px;background:#dcfce7;color:#166534;padding:10px;border-radius:10px;text-align:center;font-weight:800"></div></div>`;ativarMonitorSaida(p.acaoSaida);
}
function selecionarOpcao(div,name,letra){document.getElementById(`${name}_${letra}`).checked=true;div.parentElement.querySelectorAll('.opcao-aluno').forEach(d=>d.classList.remove('selecionada'));div.classList.add('selecionada');}
async function enviarRespostasAluno(isAuto=false){
 if(provaBloqueada)return;
 let cad=JSON.parse(localStorage.getItem('aluno_cadastro_'+sessao.id)||'null');
 let respostas=[];let falt=false;
 atividadeAtualAluno.questoes.forEach((q,i)=>{if(q.tipo=='multipla'){let s=document.querySelector(`input[name="resp_${i}"]:checked`);if(!s)falt=true;respostas.push({index:i,tipo:'multipla',resposta:s?s.value:'',gabarito:q.gab,correta:s?s.value==q.gab:false});}else{let t=document.getElementById(`resp_${i}`)?.value.trim()||'';if(!t)falt=true;respostas.push({index:i,tipo:'dissertativa',resposta:t});}});
 if(!isAuto&&falt){if(!confirm('Tem questão sem resposta. Enviar?'))return;}
 let ac=respostas.filter(r=>r.correta).length,total=atividadeAtualAluno.questoes.filter(q=>q.tipo=='multipla').length,nota=total>0?(ac/total*10).toFixed(1):'--';
 let obj={id:'resp_'+Date.now(),atividadeId:atividadeAtualAluno._docId,codigo:atividadeAtualAluno.senha,atividadeNome:atividadeAtualAluno.nome,alunoNome:cad.nome,alunoSala:cad.sala,alunoAno:cad.ano,timestamp:Date.now(),data:new Date().toLocaleString('pt-BR'),respostas,acertos:ac,totalMulti:total,notaMulti:nota,envioAutomatico:isAuto};
 await fb.setDoc(fb.doc(db,'resultados',obj.id),obj);
 provaBloqueada=true;desativarMonitorSaida();
 let ok=document.getElementById('envioOk');ok.style.display='block';ok.innerHTML=isAuto?`🚨 Enviado automaticamente! Nota ${nota}`:`✅ Enviado! Nota ${nota}`;
 document.getElementById('btnEnviarProva').disabled=true;
}
async function verRespostas(id){let r=[];let p=null;try{let s=await fb.getDocs(fb.query(fb.collection(db,'resultados'),fb.where('atividadeId','==',id)));s.forEach(d=>r.push(d.data()));let sp=await fb.getDoc(fb.doc(db,'provas',id));if(sp.exists())p=sp.data();}catch(e){}document.getElementById('tituloRespostas').innerText=`📊 ${p?.nome||''} - ${r.length} envios`;document.getElementById('listaRespostas').innerHTML=r.length==0?'Nenhuma resposta':r.map(x=>`<div class="resposta-item"><b>🎓 ${x.alunoNome}</b> ${x.envioAutomatico?'<span style="background:#ef4444;color:#fff;padding:2px 6px;border-radius:8px;font-size:10px">AUTO</span>':''}<br><small>${x.data} - ${x.alunoSala}</small><div style="background:#dcfce7;padding:6px;border-radius:10px;margin:6px 0;font-weight:800">Acertos ${x.acertos}/${x.totalMulti} Nota ${x.notaMulti}</div>${x.respostas.map((resp,i)=>`<div style="background:#fff;color:#000;padding:6px;border-radius:6px;margin:4px 0;font-size:12px">${i+1}) ${resp.tipo=='multipla'?`Resp: <b style="color:${resp.correta?'green':'red'}">${resp.resposta}</b> Gab: ${resp.gabarito}`:`${resp.resposta}`}</div>`).join('')}<button class="btn-red" onclick="apagarResp('${x.id}')">🗑️ Apagar</button></div>`).join('');document.getElementById('modalRespostas').style.display='flex';}
async function apagarResp(id){if(!confirm('Apagar?'))return;await fb.deleteDoc(fb.doc(db,'resultados',id));document.getElementById('modalRespostas').style.display='none';}
async function comprimirImagem(file){return new Promise(res=>{let r=new FileReader();r.onload=e=>{let img=new Image();img.onload=()=>{let c=document.createElement('canvas');let MAX=800;let w=img.width,h=img.height;if(w>MAX){h=h*(MAX/w);w=MAX;}if(h>MAX){w=w*(MAX/h);h=MAX;}c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);c.toBlob(b=>res(b),'image/jpeg',0.65);};img.src=e.target.result;};r.readAsDataURL(file);});}
async function uploadCatbox(fileBlob){let fd=new FormData();fd.append('reqtype','fileupload');fd.append('fileToUpload',fileBlob,Date.now()+'.jpg');let resp=await fetch('https://catbox.moe/user/api.php',{method:'POST',body:fd});let txt=await resp.text();if(!txt.startsWith('https'))throw new Error(txt);return txt.trim();}
async function carregarImagemStorage(input){
 let f=input.files[0];if(!f)return;
 let area=input.closest('.area-img');let preview=area.querySelector('.img-questao-preview');let inputHidden=area.querySelector('.imagem-base64');let btnDel=area.querySelector('.btn-red');
 try{let blob=await comprimirImagem(f);let url=await uploadCatbox(blob);let img=document.createElement('img');img.src=url;img.className='img-questao-preview';img.style.display='block';img.style.width=(area.querySelector('.img-largura').value||240)+'px';img.style.height=(area.querySelector('.img-altura').value||70)+'px';img.style.maxWidth='100%';img.style.borderRadius='8px';img.style.margin='0 auto';preview.replaceWith(img);inputHidden.value=url;btnDel.style.display='inline-block';}catch(e){alert('Falha catbox, salvando local');let blob=await comprimirImagem(f);let fr=new FileReader();fr.onload=ev=>{inputHidden.value=ev.target.result;};fr.readAsDataURL(blob);let tmpUrl=URL.createObjectURL(blob);preview.src=tmpUrl;}
}
function carregarImagem(input){carregarImagemStorage(input);}
async function trocarLogoExterno(input){let f=input.files[0];if(!f)return;try{let blob=await comprimirImagem(f);let url=await uploadCatbox(blob);document.getElementById('img_logo').src=url;localStorage.setItem('logo_ee_url',url);}catch(e){let r=new FileReader();r.onload=ev=>{document.getElementById('img_logo').src=ev.target.result;localStorage.setItem('logo_ee_url',ev.target.result);};r.readAsDataURL(f);}}
function limparTodasImagens(){if(!confirm('Apagar TODAS as fotos?'))return;document.querySelectorAll('.q-editor').forEach(div=>{let area=div.querySelector('.area-img');if(area){let p=area.querySelector('.img-questao-preview');if(p){p.style.display='none';p.src='';}area.querySelector('.imagem-base64').value='';let b=area.querySelector('.btn-red');if(b)b.style.display='none';}});alert('✅ Fotos removidas!');}
let logoUrl=localStorage.getItem('logo_ee_url');if(logoUrl)document.getElementById('img_logo').src=logoUrl;
let editandoId=null;
function addQuestao(d=null){let c=document.getElementById('editorQuestoes');let num=c.children.length+1;let tipo=d?.tipo||'dissertativa';let larg=d?.imgLarg||240,alt=d?.imgAlt||70;let div=document.createElement('div');div.className='q-editor '+(d?'salva':'pendente');div.dataset.salva=d?"true":"false";div.dataset.tipo=tipo;div.innerHTML=`<div class="q-header"><span class="badge-questao">Q ${num}</span><span class="${d?'badge-salva':'badge-pendente'}">${d?'✅':'⌛'}</span></div><button class="btn-red" style="position:absolute;top:8px;right:8px" onclick="this.parentElement.remove();renumerar()">✕</button><div class="tipo-questao"><button class="btn-tipo ${tipo=='multipla'?'ativo multipla':''}" onclick="setTipo(this,'multipla')">📝 Múltipla</button><button class="btn-tipo ${tipo=='dissertativa'?'ativo dissertativa':''}" onclick="setTipo(this,'dissertativa')">✍️ Dissertativa</button></div><textarea class="pergunta-input" placeholder="Pergunta">${d?.pergunta||""}</textarea><div class="area-img"><img class="img-questao-preview" src="${d?.imagem||""}" style="${d?.imagem?'':'display:none'};width:${larg}px;height:${alt}px;max-width:100%;border-radius:8px"><input type="file" class="input-img" accept="image/*" style="display:none" onchange="carregarImagem(this)"><div style="display:flex;gap:6px;justify-content:center;margin-top:4px"><button class="btn-img" onclick="this.parentElement.parentElement.querySelector('.input-img').click()">📁 FOTO INFINITA (link)</button><button class="btn-red" onclick="removerImagem(this)" style="${d?.imagem?'':'display:none'}">🗑️</button></div><div style="display:flex;gap:4px;justify-content:center;margin-top:4px"><div style="background:#1e3a8a;padding:3px 8px;border-radius:15px;color:#fff"><span style="font-size:9px">L:</span><input type="number" class="img-largura" value="${larg}" style="width:55px;padding:2px;margin:0;font-size:11px" oninput="atualizarTamanho(this)"></div><div style="background:#1e3a8a;padding:3px 8px;border-radius:15px;color:#fff"><span style="font-size:9px">A:</span><input type="number" class="img-altura" value="${alt}" style="width:55px;padding:2px;margin:0;font-size:11px" oninput="atualizarTamanho(this)"></div></div><input type="hidden" class="imagem-base64" value="${d?.imagem||""}"></div><div class="area-multipla" style="${tipo=='dissertativa'?'display:none':''}"><div>A<input class="alt-A" value="${d?.A||""}"></div><div>B<input class="alt-B" value="${d?.B||""}"></div><div>C<input class="alt-C" value="${d?.C||""}"></div><div>D<input class="alt-D" value="${d?.D||""}"></div>Correta: <select class="gab-select"><option>A</option><option>B</option><option>C</option><option>D</option></select></div><div class="area-dissertativa" style="${tipo=='multipla'?'display:none':''}">Linhas: <select class="linhas-select"><option value="3">3</option><option value="4" selected>4</option><option value="6">6</option></select></div><button class="btn-save" onclick="salvarQuestao(this)" style="${d?'display:none':''}">💾 SALVAR QUESTÃO</button><button class="btn-edit" onclick="editarQuestao(this)" style="${d?'':'display:none'}">✏️ EDITAR</button>`;c.appendChild(div);if(d?.gab)div.querySelector('.gab-select').value=d.gab;if(d?.linhas)div.querySelector('.linhas-select').value=d.linhas;if(d)div.querySelectorAll('input[type=text],textarea').forEach(e=>e.disabled=true);renumerar();}
function setTipo(btn,tipo){let d=btn.closest('.q-editor');d.dataset.tipo=tipo;d.querySelectorAll('.btn-tipo').forEach(b=>b.classList.remove('ativo','multipla','dissertativa'));btn.classList.add('ativo',tipo);d.querySelector('.area-multipla').style.display=tipo=='multipla'?'block':'none';d.querySelector('.area-dissertativa').style.display=tipo=='dissertativa'?'block':'none';}
function removerImagem(btn){let a=btn.closest('.area-img');let p=a.querySelector('.img-questao-preview');p.style.display='none';p.src='';a.querySelector('.imagem-base64').value='';btn.style.display='none';}
function atualizarTamanho(i){let a=i.closest('.area-img');let img=a.querySelector('.img-questao-preview');if(img){img.style.width=a.querySelector('.img-largura').value+'px';img.style.height=a.querySelector('.img-altura').value+'px';}}
function salvarQuestao(btn){let d=btn.closest('.q-editor');if(!d.querySelector('.pergunta-input').value.trim())return alert('Escreva pergunta');d.querySelectorAll('input,textarea,select').forEach(e=>e.disabled=true);d.dataset.salva="true";d.classList.remove('pendente');d.classList.add('salva');d.querySelector('.q-header span:last-child').innerText='✅';btn.style.display='none';d.querySelector('.btn-edit').style.display='block';}
function editarQuestao(btn){let d=btn.closest('.q-editor');d.querySelectorAll('input,textarea,select').forEach(e=>e.disabled=false);d.dataset.salva="false";d.classList.remove('salva');d.classList.add('pendente');d.querySelector('.q-header span:last-child').innerText='⌛';btn.style.display='none';d.querySelector('.btn-save').style.display='block';}
function renumerar(){document.querySelectorAll('.q-editor').forEach((d,i)=>d.querySelector('.badge-questao').innerText='Q '+(i+1));}
function coletarSalvas(){let l=[];document.querySelectorAll('.q-editor[data-salva="true"]').forEach(div=>{l.push({tipo:div.dataset.tipo,pergunta:div.querySelector('.pergunta-input').value,imagem:div.querySelector('.imagem-base64').value,imgLarg:div.querySelector('.img-largura').value,imgAlt:div.querySelector('.img-altura').value,A:div.querySelector('.alt-A')?.value||"",B:div.querySelector('.alt-B')?.value||"",C:div.querySelector('.alt-C')?.value||"",D:div.querySelector('.alt-D')?.value||"",gab:div.querySelector('.gab-select')?.value||"A",linhas:div.querySelector('.linhas-select')?.value||"4"});});return l;}
async function finalizarSalvarPC(){
 let s=JSON.parse(localStorage.getItem('editor_sessao')||'null');
 let nome=prov_titulo.value,codigo=prov_codigo.value,escola=nomeEscola.value,titulo=tituloAvaliacao.value,prof=nomeProfessor.value,qs=coletarSalvas(),ini=prov_inicio.value,fim=prov_fim.value,max=prov_tentativas.value,acao=prov_saida.value;
 if(!qs.length)return alert('Salve 1 questão');if(!codigo)return alert('Código');
 if(ini&&fim&&new Date(ini)>=new Date(fim))return alert('Data início antes do fim');
 let id=editandoId||'pc_'+Date.now();
 let obj={id,nome,senha:codigo,qtd:qs.length,questoes:qs,escola,tituloAva:titulo,professor:prof,timestamp:Date.now(),ownerId:s.id,ownerNome:s.nome,inicio:ini||'',fim:fim||'',maxTentativas:max,acaoSaida:acao};
 await fb.setDoc(fb.doc(db,'provas',id),obj);
 alert('✅ Salvo! Código: '+codigo);novaProva();await carregarTudoFirebase();
}
async function carregarTudoFirebase(){
 let s=JSON.parse(localStorage.getItem('editor_sessao')||'null');if(!s)return;
 let todas=[];let resp=[];try{let snap=await fb.getDocs(fb.collection(db,'provas'));snap.forEach(d=>todas.push({...d.data(),_docId:d.id}));let sr=await fb.getDocs(fb.collection(db,'resultados'));sr.forEach(d=>resp.push(d.data()));document.getElementById('statusFirebase').innerText=`✅ ${todas.length} provas`;}catch(e){document.getElementById('statusFirebase').innerText='Erro Firestore';}
 let filt=s.tipo=='master'?todas:todas.filter(p=>p.ownerId==s.id);
 document.getElementById('listaProvas').innerHTML=filt.map(p=>{let qtd=resp.filter(r=>r.atividadeId==(p._docId||p.id)).length;let fotoCount=p.questoes.filter(q=>q.imagem).length;return `<div style="background:var(--card);padding:14px;border-radius:14px;margin:10px 0;display:flex;justify-content:space-between;align-items:center;border:2px solid var(--border)"><div><b>${p.nome||'Sem assunto'} - ${p.senha}</b> <span style="background:#a855f7;color:#fff;padding:2px 8px;border-radius:10px;font-size:10px">${fotoCount} fotos</span> <span style="background:#8b5cf6;color:#fff;padding:2px 8px;border-radius:10px;font-size:10px">${qtd} resp</span><br><small>${p.escola} | ${p.qtd} q</small></div><div style="display:flex;gap:4px;flex-wrap:wrap"><button class="btn-sec" style="background:#8b5cf6;color:#fff" onclick="verRespostas('${p._docId||p.id}')">📊 ${qtd}</button><button class="btn-edit-prova" onclick="editarProvaCompleta('${p._docId||p.id}')">✏️</button><button class="btn-red" onclick="apagarProvaFirebase('${p._docId||p.id}')">🗑️</button></div></div>`;}).join('')||'Nenhuma prova';
}
async function editarProvaCompleta(id){let snap=await fb.getDoc(fb.doc(db,'provas',id));if(!snap.exists())return;let p=snap.data();editandoId=id;nomeEscola.value=p.escola;tituloAvaliacao.value=p.tituloAva;nomeProfessor.value=p.professor||"";prov_titulo.value=p.nome;prov_codigo.value=p.senha;prov_inicio.value=p.inicio||'';prov_fim.value=p.fim||'';prov_tentativas.value=p.maxTentativas||'0';prov_saida.value=p.acaoSaida||'aviso';avisoEditando.style.display='block';btnFinalizar.innerText='💾 ATUALIZAR NUVEM';editorQuestoes.innerHTML='';p.questoes.forEach(q=>addQuestao(q));window.scrollTo({top:0,behavior:'smooth'});}
async function apagarProvaFirebase(id){if(!confirm('Apagar prova?'))return;await fb.deleteDoc(fb.doc(db,'provas',id));carregarTudoFirebase();}
function novaProva(){editandoId=null;avisoEditando.style.display='none';btnFinalizar.innerText='💾 SALVAR NA NUVEM (links)';prov_inicio.value='';prov_fim.value='';prov_tentativas.value='0';prov_saida.value='aviso';editorQuestoes.innerHTML='';addQuestao();}
verificarSessao();addQuestao();
</script></body></html>
