<style>
:root{--bg:#0f172a;--card:#1e293b;--input:#1e293b;--text:#e2e8f0;--border:#334155;--azul:#3b82f6}
body.claro{--bg:#dbeafe;--card:#ffffff;--input:#eff6ff;--text:#1e3a8a;--border:#93c5fd;--azul:#2563eb}
body{font-family:system-ui;background:var(--bg);color:var(--text);text-align:center;padding:10px;margin:0}
.card{background:var(--card);padding:22px;border-radius:20px;max-width:980px;margin:20px auto;text-align:left;border:2px solid var(--border)}
.input-padrao{width:100%;padding:12px 16px;margin:6px 0;border-radius:12px;border:2px solid var(--border);font-size:13px;box-sizing:border-box;background:var(--input);color:var(--text)}
.btn-tema{position:fixed;top:12px;right:12px;z-index:999;background:linear-gradient(135deg,#2563eb,#60a5fa);color:#fff;padding:11px 20px;border-radius:30px;font-weight:900;font-size:12px;border:none;cursor:pointer}
input,textarea,select{width:100%;padding:12px;margin:6px 0;border-radius:12px;border:2px solid var(--border);font-size:15px;box-sizing:border-box;background:var(--input);color:var(--text)}
button{border:none;padding:11px 16px;font-weight:800;border-radius:30px;margin:3px;cursor:pointer;font-size:10px}
.btn-go{background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff}.btn-blue{background:linear-gradient(135deg,#2563eb,#3b82f6);color:#fff}.btn-red{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff}.btn-sec{background:var(--border);color:var(--text)}.btn-edit-prova{background:linear-gradient(135deg,#facc15,#eab308);color:#000}.btn-img{background:linear-gradient(135deg,#a855f7,#9333ea);color:#fff}.btn-logo{background:linear-gradient(135deg,#2563eb,#60a5fa);color:#fff;width:100%;margin-top:8px;font-size:10px}.btn-save{background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;width:100%;padding:14px;margin-top:10px;font-size:13px}.btn-edit{background:linear-gradient(135deg,#facc15,#eab308);color:#000;width:100%;padding:14px;margin-top:10px}

.q-header{position:absolute;top:-14px;left:12px;display:flex;gap:8px}.badge-questao{background:linear-gradient(135deg,#2563eb,#3b82f6);color:#fff;padding:5px 14px;border-radius:20px;font-weight:900;font-size:12px}.badge-pendente{background:#ef4444;color:#fff;padding:4px 10px;border-radius:20px;font-size:11px}.badge-salva{background:#22c55e;color:#fff;padding:4px 10px;border-radius:20px;font-size:11px}
.tipo-questao{display:flex;gap:8px;margin:12px 0}.btn-tipo{flex:1;padding:12px;border-radius:30px;font-weight:900;border:2px solid var(--border);background:var(--card);color:var(--text)}.btn-tipo.ativo.multipla{background:var(--azul);color:#fff}.btn-tipo.ativo.dissertativa{background:#facc15;color:#000}
.config-header{background:linear-gradient(135deg,var(--card),var(--input));padding:18px;border-radius:18px;border:2px solid var(--azul);margin-bottom:18px;display:grid;grid-template-columns:110px 1fr;gap:14px}
.logo-preview{width:100px;height:100px;object-fit:contain;background:#fff;border-radius:14px;border:3px solid var(--border);display:block}.area-img{border:2px dashed #a855f7;padding:10px;border-radius:14px;margin:8px 0;text-align:center;background:var(--card)}.aviso-editando{display:none;background:linear-gradient(135deg,#facc15,#eab308);color:#000;padding:10px;border-radius:10px;text-align:center;font-weight:900;font-size:12px;margin-bottom:12px}
h2{color:var(--azul)} #telaLogin{position:fixed;inset:0;background:radial-gradient(circle at top,#dbeafe,#1e3a8a);display:flex;align-items:center;justify-content:center;z-index:10000;padding:20px}.login-card{background:#fff;padding:30px;border-radius:20px;max-width:380px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,0.3);text-align:center;color:#1e3a8a}
.top-bar{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:2px solid var(--border);padding:10px 14px;border-radius:14px;margin-bottom:14px;flex-wrap:wrap;gap:8px}.user-info{font-size:12px;font-weight:800;color:var(--azul)}.modal-fundo{position:fixed;inset:0;background:rgba(0,0,0,0.7);display:none;align-items:center;justify-content:center;z-index:9999;padding:15px}.modal-box{background:var(--card);padding:22px;border-radius:18px;max-width:750px;width:100%;border:2px solid var(--border);max-height:90vh;overflow:auto;color:var(--text)}.lista-prof{max-height:380px;overflow:auto;margin-top:10px}.item-prof{display:flex;justify-content:space-between;align-items:center;background:var(--input);padding:10px;border-radius:10px;margin:6px 0;border:1px solid var(--border);flex-direction:column;align-items:stretch}.aluno-card{background:linear-gradient(135deg,var(--card),var(--input));border:2px solid var(--azul);padding:18px;border-radius:16px;margin-bottom:16px}.resposta-item{background:var(--input);border:1.5px solid var(--border);padding:12px;border-radius:12px;margin:10px 0}
.config-prova{background:var(--input);border:2px solid #f59e0b;border-radius:14px;padding:14px;margin:10px 0}
</style></head><body>
<div id="telaLogin"><div class="login-card"><h1>📝 EDITOR</h1><p>Fix fotos + salvar</p><input id="loginUser" class="input-padrao" placeholder="USUÁRIO"><input id="loginPass" type="password" class="input-padrao" placeholder="SENHA"><button class="btn-blue" style="width:100%;padding:14px;margin-top:10px" onclick="fazerLogin()">ENTRAR</button><div style="font-size:11px;background:#eff6ff;padding:8px;border-radius:10px;text-align:left;margin-top:10px">Master: master / 1234<br>Aluno: aluno / aluno</div><div id="loginErro" style="color:#ef4444;font-size:12px;display:none;margin-top:8px"></div><div id="statusFirebase" style="font-size:10px;color:#888;margin-top:6px">Conectando...</div></div></div>
<button class="btn-tema" onclick="document.body.classList.toggle('claro')">☀️</button><h2>📝 EDITOR</h2>
<div class="card" id="appPrincipal" style="display:none"><div class="top-bar"><div class="user-info" id="infoUsuario"></div><div><button class="btn-sec" onclick="abrirGerenciarProf()" id="btnGerenciar" style="display:none">⚙️ PROFESSORES</button><button class="btn-red" onclick="sair()">🚪 SAIR</button></div></div><div id="avisoEditando" class="aviso-editando">✏️ EDITANDO</div>
<div id="boxCabecalho" class="config-header"><div style="text-align:center"><img id="img_logo" class="logo-preview" src="https://via.placeholder.com/100"><input type="file" id="inputLogo" accept="image/*" style="display:none" onchange="trocarLogo(this)"><button class="btn-logo" onclick="document.getElementById('inputLogo').click()">📁 LOGO</button></div><div><input id="nomeEscola" class="input-padrao" value="E.E. PROFESSOR ALISSON PEREIRA GUIMARÃES"><input id="tituloAvaliacao" class="input-padrao" value="ATIVIDADE DE MATEMÁTICA"><input id="nomeProfessor" class="input-padrao" placeholder="NOME DO PROFESSOR"><div style="display:grid;grid-template-columns:2fr 1fr;gap:8px"><input id="prov-titulo" class="input-padrao" placeholder="Assunto"><input id="prov-codigo" class="input-padrao" placeholder="CÓDIGO"></div></div></div>
<div class="config-prova"><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div><label style="font-size:11px">INÍCIO</label><input id="prov-inicio" type="datetime-local" class="input-padrao"></div><div><label style="font-size:11px">FIM</label><input id="prov-fim" type="datetime-local" class="input-padrao"></div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px"><div><label style="font-size:11px">TENTATIVAS</label><select id="prov-tentativas" class="input-padrao"><option value="0">0 - Infinito</option><option value="1">1 vez</option><option value="2">2 vezes</option><option value="3">3 vezes</option></select></div><div><label style="font-size:11px">SAIR DA TELA</label><select id="prov-saida" class="input-padrao"><option value="aviso">1 - Só aviso</option><option value="enviar_fechar">2 - Envia e fecha</option></select></div></div></div>
<div id="editorQuestoes"></div><button class="btn-blue" style="width:100%;padding:14px" onclick="addQuestao()">+ ADICIONAR QUESTÃO</button><div style="margin-top:14px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap"><button class="btn-sec" onclick="novaProva()">+ NOVA</button><button class="btn-go" id="btnFinalizar" onclick="finalizarSalvarPC()">💾 SALVAR NA NUVEM</button></div><div id="listaProvas" style="margin-top:18px"></div></div>

<div id="modalProf" class="modal-fundo"><div class="modal-box"><h3>⚙️ GERENCIAR</h3>
<div id="areaMaster" style="display:none;background:#fee2e2;border:2px solid #ef4444;padding:14px;border-radius:14px;margin-bottom:14px"><b style="color:#dc2626">🔐 TROCAR SENHA DO MASTER</b><input id="novaSenhaMaster" class="input-padrao" placeholder="Nova senha master"><button class="btn-red" style="width:100%" onclick="alterarSenhaMaster()">💾 SALVAR MASTER</button></div>
<input id="novoProfNome" class="input-padrao" placeholder="Nome"><input id="novoProfUser" class="input-padrao" placeholder="Usuário minúsculo"><input id="novoProfPass" class="input-padrao" placeholder="Senha"><button class="btn-go" style="width:100%" onclick="criarProfessor()">➕ CRIAR</button><div id="listaProfessores" class="lista-prof"></div><button class="btn-sec" style="width:100%;margin-top:10px" onclick="document.getElementById('modalProf').style.display='none'">FECHAR</button></div></div>

<script>
let usuarios=JSON.parse(localStorage.getItem('editor_usuarios')||'[]');if(!usuarios.length){usuarios=[{id:'master_1',nome:'Master',usuario:'master',senha:'1234',tipo:'master'},{id:'aluno_1',nome:'Aluno',usuario:'aluno',senha:'aluno',tipo:'aluno'}];localStorage.setItem('editor_usuarios',JSON.stringify(usuarios));}
let sessao=JSON.parse(localStorage.getItem('editor_sessao')||'null');
async function verificarSessao(){sessao=JSON.parse(localStorage.getItem('editor_sessao')||'null');if(!sessao){document.getElementById('telaLogin').style.display='flex';document.getElementById('appPrincipal').style.display='none';return;}document.getElementById('telaLogin').style.display='none';document.getElementById('appPrincipal').style.display='block';document.getElementById('infoUsuario').innerHTML=`👤 ${sessao.nome} | ${sessao.tipo}`;if(sessao.tipo=='master')document.getElementById('btnGerenciar').style.display='inline-block';document.getElementById('nomeProfessor').value=sessao.nome;await carregarTudoFirebase();}
async function fazerLogin(){
 let u=document.getElementById('loginUser').value.trim(),s=document.getElementById('loginPass').value.trim(),erroEl=document.getElementById('loginErro');
 if(!u||!s){erroEl.style.display='block';erroEl.innerText='Digite usuário e senha';return;}
 let local=JSON.parse(localStorage.getItem('editor_usuarios')||'[]').find(x=>x.usuario.toLowerCase()===u.toLowerCase()&&x.senha===s);
 if(local){localStorage.setItem('editor_sessao',JSON.stringify(local));verificarSessao();return;}
 if(u.toLowerCase()==='master'&&s==='1234'){let m={id:'master_1',nome:'Master',usuario:'master',senha:'1234',tipo:'master'};localStorage.setItem('editor_sessao',JSON.stringify(m));verificarSessao();return;}
 try{let snap=await fb.getDocs(fb.collection(db,'professores'));let achou=null;snap.forEach(d=>{let p=d.data();if(p.usuario&&p.senha&&p.usuario.toLowerCase().trim()===u.toLowerCase().trim()&&p.senha.trim()===s.trim())achou=p;});if(achou){localStorage.setItem('editor_sessao',JSON.stringify({id:achou.id,nome:achou.nome,usuario:achou.usuario,senha:achou.senha,tipo:achou.tipo||'professor'}));verificarSessao();return;}erroEl.style.display='block';erroEl.innerText='❌ Senha errada. No Firebase: '+Array.from(snap.docs).map(d=>d.data().usuario).join(', ');}catch(e){erroEl.style.display='block';erroEl.innerText='Erro: '+e.message;}
}
function sair(){localStorage.removeItem('editor_sessao');location.reload();}
function abrirGerenciarProf(){document.getElementById('modalProf').style.display='flex';let s=JSON.parse(localStorage.getItem('editor_sessao')||'null');document.getElementById('areaMaster').style.display=(s&&s.tipo==='master')?'block':'none';carregarListaProfFirebase();}
async function alterarSenhaMaster(){let nova=document.getElementById('novaSenhaMaster').value.trim();if(!nova||nova.length<3)return alert('Mínimo 3 letras');await fb.setDoc(fb.doc(db,'professores','master'),{id:'master',usuario:'master',senha:nova,nome:'Master - Admin',tipo:'master',timestamp:Date.now()});let lista=JSON.parse(localStorage.getItem('editor_usuarios')||'[]');let m=lista.find(x=>x.usuario==='master');if(m)m.senha=nova;else lista.push({id:'master_1',nome:'Master',usuario:'master',senha:nova,tipo:'master'});localStorage.setItem('editor_usuarios',JSON.stringify(lista));alert('✅ Master agora: master / '+nova);document.getElementById('novaSenhaMaster').value='';carregarListaProfFirebase();}
function editarSenhaProf(id){let d=document.getElementById('edit_'+id);d.style.display=d.style.display==='none'?'block':'none';}
async function salvarNovaSenhaProf(id){let nova=document.getElementById('inp_'+id).value.trim();if(!nova||nova.length<3)return alert('Senha curta');let ref=fb.doc(db,'professores',id);let snap=await fb.getDoc(ref);if(snap.exists()){let dados=snap.data();dados.senha=nova;await fb.setDoc(ref,dados);}let lista=JSON.parse(localStorage.getItem('editor_usuarios')||'[]');let u=lista.find(x=>x.usuario===id);if(u){u.senha=nova;localStorage.setItem('editor_usuarios',JSON.stringify(lista));}alert('✅ Senha "'+id+'" -> '+nova);carregarListaProfFirebase();}
async function carregarListaProfFirebase(){let snap=await fb.getDocs(fb.collection(db,'professores'));let s=JSON.parse(localStorage.getItem('editor_sessao')||'null');let isMaster=s&&s.tipo==='master';let h='';snap.forEach(d=>{let p=d.data();if(p.usuario==='master'&&!isMaster)return;h+=`<div class="item-prof"><div style="display:flex;justify-content:space-between;align-items:center;width:100%"><div><b>${p.usuario}</b> - ${p.nome}<br><small>senha: ${p.senha}</small></div><div style="display:flex;gap:4px">${isMaster?`<button class="btn-edit-prova" onclick="editarSenhaProf('${d.id}')">✏️</button>`:''}<button class="btn-red" onclick="excluirProfFirebase('${d.id}')">🗑️</button></div></div>${isMaster?`<div id="edit_${d.id}" style="display:none;margin-top:8px;background:#fff;padding:8px;border-radius:8px;color:#000"><input id="inp_${d.id}" class="input-padrao" value="${p.senha}"><button class="btn-go" style="width:100%" onclick="salvarNovaSenhaProf('${d.id}')">💾 SALVAR ${p.usuario}</button></div>`:''}</div>`;});document.getElementById('listaProfessores').innerHTML=h||'Nenhum';}
async function criarProfessor(){let n=document.getElementById('novoProfNome').value.trim(),u=document.getElementById('novoProfUser').value.trim().toLowerCase(),p=document.getElementById('novoProfPass').value.trim();if(!n||!u||!p)return alert('Preencha');await fb.setDoc(fb.doc(db,'professores',u),{id:u,usuario:u,senha:p,nome:n,tipo:'professor',timestamp:Date.now()});alert('✅ Criado: '+u+' / '+p);carregarListaProfFirebase();}
async function excluirProfFirebase(id){if(!confirm('Excluir '+id+'?'))return;await fb.deleteDoc(fb.doc(db,'professores',id));carregarListaProfFirebase();}

// --- IMAGEM FIX: sempre salva local se catbox falhar ---
async function comprimirImagem(file){return new Promise(res=>{let r=new FileReader();r.onload=e=>{let img=new Image();img.onload=()=>{let c=document.createElement('canvas');let MAX=900;let w=img.width,h=img.height;if(w>MAX||h>MAX){let ratio=Math.min(MAX/w,MAX/h);w*=ratio;h*=ratio;}c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);c.toBlob(b=>res(b),'image/jpeg',0.7);};img.src=e.target.result;};r.readAsDataURL(file);});}
async function uploadCatbox(fileBlob){let fd=new FormData();fd.append('reqtype','fileupload');fd.append('fileToUpload',fileBlob);let resp=await fetch('https://catbox.moe/user/api.php',{method:'POST',body:fd});let txt=await resp.text();if(!txt.startsWith('https'))throw txt;return txt.trim();}
async function carregarImagem(input){
 let f=input.files[0];if(!f)return;let area=input.closest('.area-img');let preview=area.querySelector('.img-questao-preview');let hidden=area.querySelector('.imagem-base64');let btnDel=area.querySelector('.btn-apagar-img');area.querySelector('.status-img').innerText='⏳ Comprimindo...';
 try{let blob=await comprimirImagem(f);
   // mostra preview local NA HORA
   let localUrl=URL.createObjectURL(blob);preview.src=localUrl;preview.style.display='block';preview.style.width=area.querySelector('.img-largura').value+'px';preview.style.height=area.querySelector('.img-altura').value+'px';
   let reader=new FileReader();reader.onload=e=>{hidden.value=e.target.result;area.querySelector('.status-img').innerText='✅ Foto local (funciona)';btnDel.style.display='inline-block';};reader.readAsDataURL(blob);
   // tenta catbox em segundo plano (se der certo, troca)
   try{area.querySelector('.status-img').innerText='⏳ Tentando link infinito...';let url=await uploadCatbox(blob);hidden.value=url;area.querySelector('.status-img').innerText='✅ Foto LINK infinito!';}catch(e){console.log('catbox falhou, ficou local');}
 }catch(e){alert('Erro imagem: '+e);}
}
function removerImagem(btn){let a=btn.closest('.area-img');a.querySelector('.img-questao-preview').style.display='none';a.querySelector('.img-questao-preview').src='';a.querySelector('.imagem-base64').value='';a.querySelector('.status-img').innerText='Sem foto';btn.style.display='none';}
function atualizarTamanho(i){let a=i.closest('.area-img');let img=a.querySelector('.img-questao-preview');if(img){img.style.width=a.querySelector('.img-largura').value+'px';img.style.height=a.querySelector('.img-altura').value+'px';}}
async function trocarLogo(input){let f=input.files[0];if(!f)return;let blob=await comprimirImagem(f);let r=new FileReader();r.onload=e=>{document.getElementById('img_logo').src=e.target.result;localStorage.setItem('logo_ee_url',e.target.result);};r.readAsDataURL(blob);}
let logoUrl=localStorage.getItem('logo_ee_url');if(logoUrl)document.getElementById('img_logo').src=logoUrl;

let editandoId=null;
function addQuestao(d=null){let c=document.getElementById('editorQuestoes');let num=c.children.length+1;let tipo=d?.tipo||'dissertativa';let larg=d?.imgLarg||240,alt=d?.imgAlt||70;let div=document.createElement('div');div.className='q-editor '+(d?'salva':'pendente');div.dataset.salva=d?"true":"false";div.dataset.tipo=tipo;div.innerHTML=`<div class="q-header"><span class="badge-questao">Q ${num}</span><span class="${d?'badge-salva':'badge-pendente'}">${d?'✅':'⌛'}</span></div><button class="btn-red" style="position:absolute;top:8px;right:8px" onclick="this.parentElement.remove();renumerar()">✕</button><div class="tipo-questao"><button class="btn-tipo ${tipo=='multipla'?'ativo multipla':''}" onclick="setTipo(this,'multipla')">📝 Múltipla</button><button class="btn-tipo ${tipo=='dissertativa'?'ativo dissertativa':''}" onclick="setTipo(this,'dissertativa')">✍️ Dissertativa</button></div><textarea class="pergunta-input" placeholder="Pergunta">${d?.pergunta||""}</textarea><div class="area-img"><img class="img-questao-preview" src="${d?.imagem||""}" style="${d?.imagem?'':'display:none'};width:${larg}px;height:${alt}px;max-width:100%;border-radius:8px;display:${d?.imagem?'block':'none'};margin:0 auto"><input type="file" class="input-img" accept="image/*" style="display:none" onchange="carregarImagem(this)"><div style="display:flex;gap:6px;justify-content:center;margin-top:4px"><button class="btn-img" onclick="this.parentElement.parentElement.querySelector('.input-img').click()">📁 FOTO INFINITA</button><button class="btn-red btn-apagar-img" onclick="removerImagem(this)" style="${d?.imagem?'':'display:none'}">🗑️</button></div><div style="font-size:10px;margin-top:4px" class="status-img">${d?.imagem?'✅ Foto salva':'Sem foto'}</div><div style="display:flex;gap:4px;justify-content:center;margin-top:4px"><div style="background:#1e3a8a;padding:3px 8px;border-radius:15px;color:#fff"><span style="font-size:9px">L:</span><input type="number" class="img-largura" value="${larg}" style="width:55px;padding:2px;margin:0;font-size:11px" oninput="atualizarTamanho(this)"></div><div style="background:#1e3a8a;padding:3px 8px;border-radius:15px;color:#fff"><span style="font-size:9px">A:</span><input type="number" class="img-altura" value="${alt}" style="width:55px;padding:2px;margin:0;font-size:11px" oninput="atualizarTamanho(this)"></div></div><input type="hidden" class="imagem-base64" value="${d?.imagem||""}"></div><div class="area-multipla" style="${tipo=='dissertativa'?'display:none':''}"><div>A<input class="alt-A" value="${d?.A||""}"></div><div>B<input class="alt-B" value="${d?.B||""}"></div><div>C<input class="alt-C" value="${d?.C||""}"></div><div>D<input class="alt-D" value="${d?.D||""}"></div>Correta: <select class="gab-select"><option>A</option><option>B</option><option>C</option><option>D</option></select></div><div class="area-dissertativa" style="${tipo=='multipla'?'display:none':''}">Linhas: <select class="linhas-select"><option value="3">3</option><option value="4" selected>4</option><option value="6">6</option></select></div><button class="btn-save" onclick="salvarQuestao(this)" style="${d?'display:none':''}">💾 SALVAR QUESTÃO</button><button class="btn-edit" onclick="editarQuestao(this)" style="${d?'':'display:none'}">✏️ EDITAR</button>`;c.appendChild(div);if(d?.gab)div.querySelector('.gab-select').value=d.gab;if(d?.linhas)div.querySelector('.linhas-select').value=d.linhas;if(d)div.querySelectorAll('input[type=text],textarea').forEach(e=>e.disabled=true);renumerar();}
function setTipo(btn,tipo){let d=btn.closest('.q-editor');d.dataset.tipo=tipo;d.querySelectorAll('.btn-tipo').forEach(b=>b.classList.remove('ativo','multipla','dissertativa'));btn.classList.add('ativo',tipo);d.querySelector('.area-multipla').style.display=tipo=='multipla'?'block':'none';d.querySelector('.area-dissertativa').style.display=tipo=='dissertativa'?'block':'none';}
function salvarQuestao(btn){let d=btn.closest('.q-editor');if(!d.querySelector('.pergunta-input').value.trim())return alert('Escreva pergunta');d.querySelectorAll('input,textarea,select').forEach(e=>e.disabled=true);d.dataset.salva="true";d.classList.remove('pendente');d.classList.add('salva');d.querySelector('.q-header span:last-child').innerText='✅';btn.style.display='none';d.querySelector('.btn-edit').style.display='block';}
function editarQuestao(btn){let d=btn.closest('.q-editor');d.querySelectorAll('input,textarea,select').forEach(e=>e.disabled=false);d.dataset.salva="false";d.classList.remove('salva');d.classList.add('pendente');d.querySelector('.q-header span:last-child').innerText='⌛';btn.style.display='none';d.querySelector('.btn-save').style.display='block';}
function renumerar(){document.querySelectorAll('.q-editor').forEach((d,i)=>d.querySelector('.badge-questao').innerText='Q '+(i+1));}
function coletarSalvas(){let l=[];document.querySelectorAll('.q-editor[data-salva="true"]').forEach(div=>{l.push({tipo:div.dataset.tipo,pergunta:div.querySelector('.pergunta-input').value,imagem:div.querySelector('.imagem-base64').value,imgLarg:div.querySelector('.img-largura').value,imgAlt:div.querySelector('.img-altura').value,A:div.querySelector('.alt-A')?.value||"",B:div.querySelector('.alt-B')?.value||"",C:div.querySelector('.alt-C')?.value||"",D:div.querySelector('.alt-D')?.value||"",gab:div.querySelector('.gab-select')?.value||"A",linhas:div.querySelector('.linhas-select')?.value||"4"});});return l;}

// --- SALVAR CONSERTADO (IDs com hífen) ---
async function finalizarSalvarPC(){
 let s=JSON.parse(localStorage.getItem('editor_sessao')||'null');
 let nome=document.getElementById('prov-titulo').value.trim();
 let codigo=document.getElementById('prov-codigo').value.trim();
 let escola=document.getElementById('nomeEscola').value.trim();
 let titulo=document.getElementById('tituloAvaliacao').value.trim();
 let prof=document.getElementById('nomeProfessor').value.trim();
 let ini=document.getElementById('prov-inicio').value;
 let fim=document.getElementById('prov-fim').value;
 let max=document.getElementById('prov-tentativas').value;
 let acao=document.getElementById('prov-saida').value;
 let qs=coletarSalvas();
 if(!qs.length)return alert('❌ Você precisa clicar em 💾 SALVAR QUESTÃO em cada questão antes! Na sua print está ⌛ vermelho, tem que ficar ✅ verde');
 if(!codigo)return alert('❌ Digite o CÓDIGO da prova');
 if(!nome)return alert('❌ Digite o Assunto');
 if(ini&&fim&&new Date(ini)>=new Date(fim))return alert('Data início tem que ser antes do fim');
 try{
  let id=editandoId||'pc_'+Date.now();
  let obj={id,nome,senha:codigo,qtd:qs.length,questoes:qs,escola,tituloAva:titulo,professor:prof,timestamp:Date.now(),ownerId:s.id,ownerNome:s.nome,inicio:ini||'',fim:fim||'',maxTentativas:max,acaoSaida:acao};
  await fb.setDoc(fb.doc(db,'provas',id),obj);
  alert('✅ SALVO! Código: '+codigo+' | '+qs.length+' questões | '+qs.filter(q=>q.imagem).length+' fotos');
  novaProva();await carregarTudoFirebase();
 }catch(e){alert('Erro ao salvar: '+e.message);console.error(e);}
}
async function carregarTudoFirebase(){
 let s=JSON.parse(localStorage.getItem('editor_sessao')||'null');if(!s)return;let todas=[];try{let snap=await fb.getDocs(fb.collection(db,'provas'));snap.forEach(d=>todas.push({...d.data(),_docId:d.id}));}catch(e){console.log(e);}
 let filt=s.tipo=='master'?todas:todas.filter(p=>p.ownerId==s.id);
 document.getElementById('listaProvas').innerHTML=filt.map(p=>{let fotoCount=p.questoes.filter(q=>q.imagem).length;return `<div style="background:var(--card);padding:14px;border-radius:14px;margin:10px 0;display:flex;justify-content:space-between;align-items:center;border:2px solid var(--border)"><div><b>${p.nome||'Sem assunto'} - ${p.senha}</b> <span style="background:#a855f7;color:#fff;padding:2px 8px;border-radius:10px;font-size:10px">${fotoCount} fotos</span><br><small>${p.escola} | ${p.qtd} q</small></div><div style="display:flex;gap:4px"><button class="btn-edit-prova" onclick="editarProvaCompleta('${p._docId||p.id}')">✏️</button><button class="btn-red" onclick="apagarProvaFirebase('${p._docId||p.id}')">🗑️</button></div></div>`;}).join('')||'Nenhuma prova';
}
async function editarProvaCompleta(id){let snap=await fb.getDoc(fb.doc(db,'provas',id));if(!snap.exists())return;let p=snap.data();editandoId=id;document.getElementById('nomeEscola').value=p.escola;document.getElementById('tituloAvaliacao').value=p.tituloAva;document.getElementById('nomeProfessor').value=p.professor||"";document.getElementById('prov-titulo').value=p.nome;document.getElementById('prov-codigo').value=p.senha;document.getElementById('prov-inicio').value=p.inicio||'';document.getElementById('prov-fim').value=p.fim||'';document.getElementById('prov-tentativas').value=p.maxTentativas||'0';document.getElementById('prov-saida').value=p.acaoSaida||'aviso';document.getElementById('avisoEditando').style.display='block';document.getElementById('btnFinalizar').innerText='💾 ATUALIZAR NUVEM';document.getElementById('editorQuestoes').innerHTML='';p.questoes.forEach(q=>addQuestao(q));window.scrollTo({top:0,behavior:'smooth'});}
async function apagarProvaFirebase(id){if(!confirm('Apagar?'))return;await fb.deleteDoc(fb.doc(db,'provas',id));carregarTudoFirebase();}
function novaProva(){editandoId=null;document.getElementById('avisoEditando').style.display='none';document.getElementById('btnFinalizar').innerText='💾 SALVAR NA NUVEM';document.getElementById('editorQuestoes').innerHTML='';addQuestao();}
verificarSessao();addQuestao();
</script></body></html>
