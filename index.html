<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EDITOR FIX</title>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";import{getFirestore,doc,setDoc,getDoc,getDocs,collection,deleteDoc,query,where}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const c={apiKey:"AIzaSyCLaqaOCJnkfG4LID1Y5RoFpgEsX9nYGOM",authDomain:"testeapi-1ad07.firebaseapp.com",projectId:"testeapi-1ad07",storageBucket:"testeapi-1ad07.firebasestorage.app",messagingSenderId:"323295128076",appId:"1:323295128076:web:3af167424f75b680f19c29"};const app=initializeApp(c);window.db=getFirestore(app);window.fb={doc,setDoc,getDoc,getDocs,collection,deleteDoc,query,where};
</script>
<style>body{font-family:system-ui;background:#0f172a;color:#e2e8f0;padding:10px}.card{background:#1e293b;padding:20px;border-radius:16px;max-width:900px;margin:auto;border:2px solid #334155} input,textarea,select{width:100%;padding:12px;margin:5px 0;border-radius:10px;border:2px solid #334155;background:#1e293b;color:#fff;box-sizing:border-box} button{border:none;padding:12px 18px;border-radius:30px;font-weight:800;cursor:pointer;margin:3px}.btn-go{background:#22c55e;color:#fff}.btn-blue{background:#2563eb;color:#fff}.btn-red{background:#ef4444;color:#fff}.btn-sec{background:#334155;color:#fff}.q-editor{background:#0f172a;padding:16px;border-radius:12px;margin:20px 0;border:2px solid #475569;position:relative}.q-editor.salva{border-color:#22c55e}.area-img{border:2px dashed #a855f7;padding:8px;border-radius:10px;margin:8px 0;text-align:center} #telaLogin{position:fixed;inset:0;background:#0f172a;display:flex;align-items:center;justify-content:center;z-index:9999}.login-card{background:#fff;color:#000;padding:24px;border-radius:16px;width:340px;text-align:center}</style></head><body>
<div id="telaLogin"><div class="login-card"><h2>EDITOR</h2><input id="loginUser" placeholder="USUÁRIO"><input id="loginPass" type="password" placeholder="SENHA"><button class="btn-blue" style="width:100%" onclick="fazerLogin()">ENTRAR</button><div id="loginErro" style="color:red;font-size:12px;display:none"></div></div></div>
<div class="card" id="appPrincipal" style="display:none">
<div style="display:flex;justify-content:space-between"><span id="infoUsuario"></span><button class="btn-red" onclick="sair()">SAIR</button></div>
<div style="display:grid;grid-template-columns:110px 1fr;gap:10px;margin:12px 0"><img id="img_logo" src="https://via.placeholder.com/100" style="width:100px;height:100px;background:#fff;border-radius:10px"><div><input id="nomeEscola" value="E.E. PROFESSOR ALISSON"><input id="tituloAvaliacao" value="ATIVIDADE"><input id="nomeProfessor" placeholder="Professor"><input id="provTitulo" placeholder="Assunto Ex: Energia"><input id="provCodigo" placeholder="CODIGO Ex: 3A"></div></div>
<div id="editorQuestoes"></div>
<button class="btn-blue" style="width:100%" onclick="addQuestao()">+ ADICIONAR QUESTÃO</button>
<div style="display:flex;justify-content:flex-end;gap:8px;margin-top:12px"><button class="btn-sec" onclick="window.novaProva()">+ NOVA</button><button class="btn-go" onclick="window.finalizarSalvarPC()">💾 SALVAR NA NUVEM</button></div>
<div id="listaProvas" style="margin-top:16px"></div>
</div>
<script>
let sessao=null,editandoId=null;
let usuarios=JSON.parse(localStorage.getItem('editor_usuarios')||'[]');if(!usuarios.length){usuarios=[{id:'m1',nome:'Master',usuario:'master',senha:'1234',tipo:'master'}];localStorage.setItem('editor_usuarios',JSON.stringify(usuarios));}
window.verificarSessao=async function(){sessao=JSON.parse(localStorage.getItem('editor_sessao')||'null');if(!sessao){telaLogin.style.display='flex';appPrincipal.style.display='none';return;}telaLogin.style.display='none';appPrincipal.style.display='block';infoUsuario.innerText=sessao.nome;nomeProfessor.value=sessao.nome;carregarTudoFirebase();}
window.fazerLogin=async function(){let u=loginUser.value.trim(),s=loginPass.value.trim();let local=JSON.parse(localStorage.getItem('editor_usuarios')||'[]').find(x=>x.usuario.toLowerCase()===u.toLowerCase()&&x.senha===s);if(local){localStorage.setItem('editor_sessao',JSON.stringify(local));verificarSessao();return;}if(u==='master'&&s==='1234'){localStorage.setItem('editor_sessao',JSON.stringify({id:'m1',nome:'Master',usuario:'master',senha:'1234',tipo:'master'}));verificarSessao();return;}try{let snap=await fb.getDocs(fb.collection(db,'professores'));let achou=null;snap.forEach(d=>{let p=d.data();if(p.usuario.toLowerCase()===u.toLowerCase()&&p.senha===s)achou=p;});if(achou){localStorage.setItem('editor_sessao',JSON.stringify({id:achou.id,nome:achou.nome,usuario:achou.usuario,tipo:'master'}));verificarSessao();return;}loginErro.style.display='block';loginErro.innerText='Senha errada';}catch(e){loginErro.style.display='block';loginErro.innerText=e.message;}}
window.sair=function(){localStorage.removeItem('editor_sessao');location.reload();}

window.addQuestao=function(d=null){let c=document.getElementById('editorQuestoes');let tipo=d?.tipo||'multipla';let div=document.createElement('div');div.className='q-editor '+(d?'salva':'');div.dataset.salva=d?"true":"false";div.dataset.tipo=tipo;
div.innerHTML=`<b>Q ${c.children.length+1}</b> <button class="btn-red" style="float:right" onclick="this.parentElement.remove()">X</button><br><textarea class="pergunta-input" placeholder="Pergunta">${d?.pergunta||""}</textarea>
<div class="area-img"><img class="img-preview" src="${d?.imagem||""}" style="${d?.imagem?'':'display:none'};max-width:100%;border-radius:8px"><br><input type="file" accept="image/*" onchange="carregarImagem(this)"><br><small class="status-img">${d?.imagem?'✅ com foto':'sem foto'}</small><input type="hidden" class="imagem-base64" value="${d?.imagem||""}"></div>
<div>A<input class="alt-A" value="${d?.A||""}"></div><div>B<input class="alt-B" value="${d?.B||""}"></div><div>C<input class="alt-C" value="${d?.C||""}"></div><div>D<input class="alt-D" value="${d?.D||""}"></div>Correta<select class="gab-select"><option>A</option><option>B</option><option>C</option><option>D</option></select>
<br><button class="btn-go btn-save" onclick="salvarQuestao(this)" style="${d?'display:none':''}">💾 SALVAR QUESTÃO</button><button class="btn-sec btn-edit" onclick="editarQuestao(this)" style="${d?'':'display:none'}">✏️ EDITAR</button>`;
c.appendChild(div);if(d?.gab)div.querySelector('.gab-select').value=d.gab;};
window.salvarQuestao=function(btn){let d=btn.closest('.q-editor');if(!d.querySelector('.pergunta-input').value.trim())return alert('Escreva pergunta');d.dataset.salva="true";d.classList.add('salva');btn.style.display='none';d.querySelector('.btn-edit').style.display='block';}
window.editarQuestao=function(btn){let d=btn.closest('.q-editor');d.dataset.salva="false";d.classList.remove('salva');btn.style.display='none';d.querySelector('.btn-save').style.display='block';}
window.carregarImagem=function(input){let f=input.files[0];if(!f)return;let area=input.closest('.area-img');let reader=new FileReader();reader.onload=e=>{area.querySelector('.img-preview').src=e.target.result;area.querySelector('.img-preview').style.display='block';area.querySelector('.imagem-base64').value=e.target.result;area.querySelector('.status-img').innerText='✅ foto ok';};reader.readAsDataURL(f);}
window.coletarSalvas=function(){let l=[];document.querySelectorAll('.q-editor[data-salva="true"]').forEach(div=>{l.push({tipo:'multipla',pergunta:div.querySelector('.pergunta-input').value,imagem:div.querySelector('.imagem-base64').value,A:div.querySelector('.alt-A').value,B:div.querySelector('.alt-B').value,C:div.querySelector('.alt-C').value,D:div.querySelector('.alt-D').value,gab:div.querySelector('.gab-select').value});});return l;}
window.finalizarSalvarPC=async function(){
 let qs=coletarSalvas();console.log('tentando salvar',qs);
 if(!qs.length)return alert('CLIQUE EM 💾 SALVAR QUESTÃO DENTRO DA QUESTÃO PRIMEIRO! (tem que ficar verde)');
 let codigo=document.getElementById('provCodigo').value.trim();if(!codigo)return alert('Digite o CÓDIGO');
 let nome=document.getElementById('provTitulo').value.trim()||'Prova';let escola=document.getElementById('nomeEscola').value;let titulo=document.getElementById('tituloAvaliacao').value;let prof=document.getElementById('nomeProfessor').value;
 try{let id=editandoId||'pc_'+Date.now();let obj={id,nome,senha:codigo,qtd:qs.length,questoes:qs,escola,tituloAva:titulo,professor:prof,timestamp:Date.now(),ownerId:sessao.id};await fb.setDoc(fb.doc(db,'provas',id),obj);alert('✅ SALVO! '+codigo);novaProva();carregarTudoFirebase();}catch(e){alert('Erro: '+e.message);}
}
window.novaProva=function(){editandoId=null;document.getElementById('editorQuestoes').innerHTML='';document.getElementById('provTitulo').value='';document.getElementById('provCodigo').value='';addQuestao();window.scrollTo(0,0);}
window.carregarTudoFirebase=async function(){try{let snap=await fb.getDocs(fb.collection(db,'provas'));let h='';snap.forEach(d=>{let p=d.data();h+=`<div style="background:#0f172a;padding:10px;margin:6px 0;border-radius:8px;display:flex;justify-content:space-between"><b>${p.nome} - ${p.senha} (${p.qtd}q)</b><button class="btn-red" onclick="apagarProva('${d.id}')">🗑️</button></div>`;});listaProvas.innerHTML=h||'Nenhuma prova';}catch(e){listaProvas.innerHTML='Erro: '+e.message;}}
window.apagarProva=async function(id){if(!confirm('Apagar?'))return;await fb.deleteDoc(fb.doc(db,'provas',id));carregarTudoFirebase();}
verificarSessao();addQuestao();
</script></body></html>
